<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rayos exteriores (dinámicos) -->
  <g id="rays" fill="url(#sunGradient)">
    <!-- Rayo superior -->
    <path d="M 100 15 Q 95 35 100 55 Q 105 35 100 15" />
    <!-- Rayo superior derecha -->
    <path d="M 135 30 Q 125 45 140 60 Q 150 50 135 30" />
    <!-- Rayo derecha -->
    <path d="M 165 85 Q 145 90 145 105 Q 155 105 165 85" />
    <!-- Rayo inferior derecha -->
    <path d="M 140 160 Q 150 150 135 170 Q 125 155 140 160" />
    <!-- Rayo inferior -->
    <path d="M 100 185 Q 105 165 100 145 Q 95 165 100 185" />
    <!-- Rayo inferior izquierda -->
    <path d="M 60 160 Q 50 150 65 170 Q 75 155 60 160" />
    <!-- Rayo izquierda -->
    <path d="M 35 85 Q 55 90 55 105 Q 45 105 35 85" />
    <!-- Rayo superior izquierda -->
    <path d="M 65 30 Q 75 45 60 60 Q 50 50 65 30" />
  </g>
  
  <!-- Círculo espiral central -->
  <g id="spiral">
    <!-- Anillo exterior -->
    <circle cx="100" cy="100" r="65" fill="none" stroke="url(#sunGradient)" stroke-width="4" opacity="0.9" />
    
    <!-- Espiral central -->
    <path d="M 100 100 Q 110 90 120 95 Q 125 105 115 115 Q 105 120 100 110 Q 98 100 105 95" 
          fill="none" stroke="url(#sunGradient)" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    
    <!-- Anillo medio -->
    <circle cx="100" cy="100" r="45" fill="none" stroke="url(#sunGradient)" stroke-width="3" opacity="0.7" />
    
    <!-- Anillo interior -->
    <circle cx="100" cy="100" r="25" fill="url(#sunGradient)" opacity="0.6" />
    
    <!-- Centro sólido -->
    <circle cx="100" cy="100" r="12" fill="url(#sunGradient)" />
  </g>
</svg>